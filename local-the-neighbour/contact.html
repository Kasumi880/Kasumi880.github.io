    <!--contact form-->
    <section class="contact-main">
        <h2>- Contact Form -</h2>
        <p>Please contact us through the inquiry.</p>
        <form id= "contactpageForm"class="contact-form">
            <div class="contact-form-item">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required><br><br>
            </div>
            <div class="contact-form-item">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" required><br><br>
            </div>
            <div class="contact-form-item">
                <label for="pnumber">Phone Number</label>
                <input type="tel" id="pnumber" name="pnumber" pattern="[0-9]{10}" title= "type ten-digit number" required><br><br>
            </div>
            <div class="contact-form-item">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required><br><br>
            </div>
            <div class="contact-form-item message">
                <label for="message">Message</label>
                <textarea type="text" id="message" name="message" rows="20" required></textarea><br><br>
            </div>
            <input class="submit-btn" type="submit" value="Submit">
        </form>
    </section>
