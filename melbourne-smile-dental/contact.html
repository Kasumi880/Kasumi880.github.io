</head>
<body>
    <header class="web-header">
        <h1>Contact Melbourne Smile Dental</h1>
        <h2>Call (03)9999 8888</h2>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </header>
      <div class="mobilenavi">
        <a href="./index.html" class="mobiletitle">Melbourne Smile Dental</a>
        <div id="mobileMenu">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
    
        </div>
        <a href="javascript:void(0);" class="music-note-icon" onclick="mNaviDisplay()">
            <i class="fa fa-bars"></i>
        </a>
    </div>
    
      <main>
        <section class="contact-main">
          <h2>- Contact Form -</h2>
          <p>Please contact us through the inquiry.</p>
          <form id= "contactpageForm"class="contact-form">
              <div class="contact-form-item">
                  <label for="fname">First Name</label>
                  <input type="text" id="fname" name="fname" required><br><br>
              </div>
              <div class="contact-form-item">
                  <label for="lname">Last Name</label>
                  <input type="text" id="lname" name="lname" required><br><br>
              </div>
              <div class="contact-form-item phone">
                  <label for="pnumber">Phone Number</label>
                  <input type="tel" id="pnumber" name="pnumber" pattern="[0-9]{10}" title= "type ten-digit number" required><br><br>
              </div>
              <div class="contact-form-item email">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" required maxlength="100"><br><br>
              </div>
              <div class="contact-form-item message">
                  <label for="message">Message</label>
                  <textarea type="text" id="message" name="message" rows="20" required maxlength="250"></textarea><br><br>
              </div>
              <input class="submit-btn" type="submit" value="Submit">
          </form>
      </section>

      <div id="message-output" aria-live="polite"></div>
      </main>
    
      <footer>
        <p>Melbourne Smile Dental. All rights reserved.</p>
      </footer>
    
      <script src="script.js"></script>
    
</body>
</html>
